<!DOCTYPE html>
<html lang="es" class="sin-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.classList.replace("sin-js", "con-js")</script>
  <title>{% block titulo %}Vestidor Virtual{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👗</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/estilos.css') }}">
</head>
<body class="{% block cuerpo_clase %}{% endblock %}">
  <header class="barra">
    <a href="/" class="marca">Vestidor <em>Virtual</em></a>
    <nav>
      <a href="/probador" {% if request.url.path == '/probador' %}class="activo"{% endif %}>Probador</a>
      <a href="/recomendar" {% if request.url.path == '/recomendar' %}class="activo"{% endif %}>Recomiéndame</a>
    </nav>
  </header>

  <main>
    {% block contenido %}{% endblock %}
  </main>

  <footer>
    Vestidor Virtual · hecho con FastAPI, Jinja2 y pytest
  </footer>
</body>
</html>
